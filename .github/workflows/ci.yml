name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
        env:
          DOCS_SYNC_BASE: ${{ github.event.pull_request.base.sha }}
      - name: Package contains no tests
        run: |
          npm pack --dry-run 2>&1 | tee pack.txt
          ! grep -E '/tests?/|test/framework/|test/evals/|\.snap|fixtures|\.eval\.ts' pack.txt
          test "$(grep -c 'extensions/[a-z-]*/index.ts' pack.txt)" = 15
          grep -q 'extensions/prune/ARCHITECTURE.md' pack.txt

  # Required by the "release notes" ruleset on main: a release PR cannot be
  # merged until the release skill has rewritten its notes. Every other
  # PR passes without running the script.
  release-notes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - name: Release PR carries rewritten notes
        if: startsWith(github.head_ref, 'release-please--')
        run: .agents/skills/release/scripts/check.sh "$PR" "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
